name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Generate Snake
        uses: Platane/snk@master
        with:
          github_user_name: yourusername
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&snake_color=00FF00&bg=0D1117
            dist/github-contribution-grid-snake.svg?palette=github-light&snake_color=FF0000&bg=FFFFFF
            
      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          branch: output
          message: "🔄 Auto-update snake animation"
          add: 'dist/*'
